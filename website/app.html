<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeighborTech SimpleQuote</title>

<!-- PWA: lets this be "Added to Home Screen" as an installable app -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SimpleQuote">

<style>
  :root {
    --primary-color: #2563eb;
    --secondary-color: #4b5563;
    --background-color: #f3f4f6;
    --card-color: #ffffff;
    --text-color: #111827;
    --muted-color: #6b7280;
    --border-color: #e5e7eb;
    --success-color: #059669;
    --warning-color: #d97706;
    --danger-color: #dc2626;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--background-color);
    color: var(--text-color);
  }
  header {
    background: var(--card-color);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  nav { display: flex; gap: 8px; }
  nav button {
    background: none; border: none; padding: 8px 14px; font-size: 14px;
    font-weight: 600; color: var(--muted-color); cursor: pointer; border-radius: var(--radius);
  }
  nav button.active { background: var(--primary-color); color: white; }
  .header-actions { display: flex; gap: 10px; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .card {
    background: var(--card-color); border: 1px solid var(--border-color);
    border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border-color); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-color); }
  tr:hover td { background: #fafafa; cursor: pointer; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .badge-draft { background: #e5e7eb; color: #374151; }
  .badge-sent { background: #dbeafe; color: #1e40af; }
  .badge-accepted, .badge-paid { background: #d1fae5; color: #065f46; }
  .badge-declined, .badge-void { background: #fee2e2; color: #991b1b; }
  .badge-expired, .badge-overdue { background: #fef3c7; color: #92400e; }
  .badge-unpaid, .badge-partially-paid { background: #fef3c7; color: #92400e; }
  button.btn {
    font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px;
    border-radius: var(--radius); border: 1px solid var(--border-color); background: white; cursor: pointer;
  }
  button.btn:hover { background: #f9fafb; }
  button.btn-primary { background: var(--primary-color); color: white; border-color: var(--primary-color); }
  button.btn-primary:hover { filter: brightness(0.95); }
  button.btn.btn-primary:hover, button.btn.btn-primary:focus-visible {
    background: #1d4ed8; color: #ffffff; border-color: #1d4ed8;
  }
  button.btn-success { background: var(--success-color); color: white; border-color: var(--success-color); }
  button.btn-danger { color: var(--danger-color); border-color: #fecaca; }
  button.btn-small { padding: 5px 10px; font-size: 12px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .field { margin-bottom: 14px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border-color);
    border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 70px; resize: vertical; }
  .items-table th, .items-table td { padding: 6px 4px; }
  .items-table input { padding: 6px 8px; font-size: 13px; }
  .items-table .col-desc { width: 40%; }
  .items-table .col-qty, .items-table .col-rate, .items-table .col-amount { width: 14%; }
  .items-table .col-tax { width: 8%; text-align: center; }
  .totals-box { max-width: 320px; margin-left: auto; font-size: 14px; }
  .totals-box .row { display: flex; justify-content: space-between; padding: 4px 0; }
  .totals-box .row.total { font-weight: 700; font-size: 16px; border-top: 1px solid var(--border-color); margin-top: 6px; padding-top: 8px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted-color); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .form-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .status-line { font-size: 13px; margin-top: 10px; }
  .status-line.error { color: var(--danger-color); }
  .status-line.success { color: var(--success-color); }
  .hint { font-size: 12px; color: var(--muted-color); margin-top: 2px; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: white; border-radius: var(--radius); padding: 24px; max-width: 400px; width: 90%; }
  .modal-box .form-actions { justify-content: flex-end; }
  .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border:1px solid var(--border-color); border-radius:var(--radius); overflow:hidden; }
  .calendar-weekday { padding:8px; background:#f8fafc; color:var(--muted-color); font-size:11px; font-weight:700; text-transform:uppercase; text-align:center; }
  .calendar-day { min-height:112px; padding:7px; border-top:1px solid var(--border-color); border-right:1px solid var(--border-color); background:white; }
  .calendar-day:nth-child(7n) { border-right:0; }
  .calendar-day.outside { background:#f8fafc; color:#94a3b8; }
  .calendar-date { font-size:12px; font-weight:700; margin-bottom:5px; }
  .calendar-event { display:block; width:100%; border:0; border-left:3px solid var(--primary-color); background:#eff6ff; color:#1e3a8a; text-align:left; border-radius:4px; padding:5px 6px; margin:3px 0; font-size:11px; line-height:1.25; cursor:pointer; }
  .filter-row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  .filter-row .field { margin:0; min-width:180px; }
  .assistant-layout { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:18px; align-items:start; }
  .assistant-note { min-height:180px; line-height:1.5; }
  .assistant-preview { background:#f8fafc; border:1px solid var(--border-color); border-radius:var(--radius); padding:16px; }
  .assistant-preview h3 { margin:0 0 4px; font-size:16px; }
  .assistant-chip { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 9px; background:#e0f2fe; color:#075985; font-size:12px; font-weight:700; }
  .assistant-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
  .assistant-actions .btn { width:100%; }
  .assistant-disclosure { border-left:3px solid #7c3aed; background:#f5f3ff; color:#4c1d95; padding:10px 12px; border-radius:4px; font-size:12px; margin-bottom:16px; }
  .assistant-empty { color:var(--muted-color); padding:34px 14px; text-align:center; }
  @media (max-width:760px) {
    header { align-items:flex-start; gap:10px; flex-wrap:wrap; }
    nav { overflow-x:auto; width:100%; order:3; }
    .header-actions { overflow-x:auto; width:100%; }
    main { padding:14px; }
    .calendar-grid { grid-template-columns:1fr; border:0; gap:8px; }
    .calendar-weekday, .calendar-day.outside { display:none; }
    .calendar-day { min-height:auto; border:1px solid var(--border-color); border-radius:6px; }
    .calendar-day:not(:has(.calendar-event)) { display:none; }
    .assistant-layout { grid-template-columns:1fr; }
    .assistant-actions { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>NeighborTech SimpleQuote</h1>
  <nav>
    <button data-view="customers">Customers</button>
    <button data-view="leads" class="active">Leads</button>
    <button data-view="bookings">Bookings</button>
    <button data-view="catalog">Products &amp; Services</button>
    <button data-view="requests">Quote Requests</button>
    <button data-view="quotes">Quotes</button>
    <button data-view="invoices">Invoices</button>
  </nav>
  <div class="header-actions">
    <button class="btn" id="ai-assistant-btn">AI Assistant</button>
    <button class="btn" id="phone-inquiry-btn">+ Phone Inquiry</button>
    <button class="btn" id="new-customer-btn">+ Customer</button>
    <button class="btn btn-primary" id="new-quote-btn">+ New Quote</button>
    <button class="btn" id="new-invoice-btn">+ New Invoice</button>
    <a class="btn" id="settings-link" href="settings-wizard.html" style="text-decoration:none;display:inline-flex;align-items:center;">Settings</a>
  </div>
</header>

<main id="main"></main>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <p id="confirm-message"></p>
    <div class="form-actions">
      <button class="btn" id="confirm-cancel">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<script>
  // ─────────────────────────────────────────────────────────
  // CONFIG
  // ─────────────────────────────────────────────────────────
  const CONFIG = {
    apiUrl: "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE",
    adminKey: "PASTE_YOUR_PRIVATE_ADMIN_KEY_HERE"
  };
  // ─────────────────────────────────────────────────────────

  const DEMO_MODE = location.hostname.endsWith('.hf.space') || new URLSearchParams(location.search).get('demo') === '1';
  const demoNow = new Date();
  const demoState = {
    leads: [
      { Lead_ID: 'LEAD-DEMO-1', Timestamp: demoNow.toISOString(), Name: 'Maria Johnson', Email: 'maria@example.com', Phone: '555-0101', 'Service Interested': 'Home Wi-Fi help', Message: 'Wi-Fi is weak upstairs.', Status: 'New' },
      { Lead_ID: 'LEAD-DEMO-2', Timestamp: new Date(demoNow - 86400000).toISOString(), Name: 'James Carter', Email: 'james@example.com', Phone: '555-0102', 'Service Interested': 'Smart TV setup', Message: 'Need two TVs connected.', Status: 'Contacted' }
    ],
    bookings: [
      { Booking_ID: 'BKG-DEMO-1', Timestamp: demoNow.toISOString(), Name: 'Linda Perez', Email: 'linda@example.com', Phone: '555-0103', Service: 'Technology Help Visit', 'Appointment Time': new Date(demoNow.getTime() + 172800000).toISOString(), Address: '123 Main Street', Notes: 'Router and printer', Status: 'Confirmed' }
    ],
    requests: [{ Request_ID: 'REQ-DEMO-1', Timestamp: demoNow.toISOString(), Name: 'Robert Green', Email: 'robert@example.com', Phone: '555-0104', 'What do you need?': 'Computer tune-up', Details: 'Laptop is running slowly.', Status: 'New' }],
    quotes: [{ Quote_ID: 'Q-DEMO-1', Quote_Number: 'Q-2026-0001', Customer_Name: 'James Carter', Customer_Email: 'james@example.com', Customer_Phone: '555-0102', Status: 'Sent', Created_Date: demoNow.toISOString(), Expiration_Date: new Date(demoNow.getTime() + 2592000000).toISOString(), Subtotal: 170, Discount: 0, Tax: 14.45, Total: 184.45, Notes: 'Set up two smart TVs', Terms: '', Created_At: demoNow.toISOString(), items: [{ Description: 'Smart TV setup', Quantity: 2, Rate: 85, Amount: 170, Taxable: true }] }],
    invoices: [{ Invoice_ID: 'INV-DEMO-1', Invoice_Number: 'INV-2026-0001', Customer_Name: 'Susan Lee', Customer_Email: 'susan@example.com', Customer_Phone: '555-0105', Status: 'Partially Paid', Created_Date: demoNow.toISOString(), Due_Date: new Date(demoNow.getTime() + 1209600000).toISOString(), Subtotal: 300, Discount: 0, Tax: 25.5, Total: 325.5, Amount_Paid: 150, Balance_Due: 175.5, Payment_Method: 'Venmo', Notes: 'Router replacement', Payment_Instructions: 'Pay by check or Venmo.', Created_At: demoNow.toISOString(), items: [{ Description: 'Router replacement and setup', Quantity: 1, Rate: 300, Amount: 300, Taxable: true }] }]
  };
  demoState.customers = [
    { Customer_ID: 'CUST-DEMO-1', Name: 'Maria Johnson', Company: '', Email: 'maria@example.com', Phone: '555-0101', Address: '', Source: 'Lead form', Notes: '', Created_At: demoNow.toISOString(), Active: true },
    { Customer_ID: 'CUST-DEMO-2', Name: 'James Carter', Company: '', Email: 'james@example.com', Phone: '555-0102', Address: '', Source: 'Lead form', Notes: '', Created_At: demoNow.toISOString(), Active: true },
    { Customer_ID: 'CUST-DEMO-3', Name: 'Linda Perez', Company: '', Email: 'linda@example.com', Phone: '555-0103', Address: '123 Main Street', Source: 'Booking form', Notes: '', Created_At: demoNow.toISOString(), Active: true },
    { Customer_ID: 'CUST-DEMO-4', Name: 'Susan Lee', Company: '', Email: 'susan@example.com', Phone: '555-0105', Address: '', Source: 'Manual', Notes: 'Prefers text messages.', Created_At: demoNow.toISOString(), Active: true }
  ];
  demoState.leads[0].Customer_ID = 'CUST-DEMO-1'; demoState.leads[1].Customer_ID = 'CUST-DEMO-2';
  demoState.bookings[0].Customer_ID = 'CUST-DEMO-3'; demoState.quotes[0].Customer_ID = 'CUST-DEMO-2'; demoState.invoices[0].Customer_ID = 'CUST-DEMO-4';
  demoState.catalog = [
    { Item_ID: 'ITEM-DEMO-1', Name: 'Technology Help Visit', Description: 'In-home technology troubleshooting and support', Type: 'Service', Unit: 'hour', Duration_Minutes: 60, Rate: 85, Taxable: true, Active: true },
    { Item_ID: 'ITEM-DEMO-2', Name: 'Smart TV Setup', Description: 'Connect and configure one smart TV', Type: 'Service', Unit: 'each', Duration_Minutes: 45, Rate: 85, Taxable: true, Active: true },
    { Item_ID: 'ITEM-DEMO-3', Name: 'Wi-Fi Router', Description: 'Dual-band home Wi-Fi router', Type: 'Product', Unit: 'each', Duration_Minutes: 0, Rate: 129, Taxable: true, Active: true }
  ];

  function demoApi(action, params) {
    const clone = value => JSON.parse(JSON.stringify(value));
    if (action === 'list_leads') return { success: true, data: clone(demoState.leads) };
    if (action === 'list_customers') return { success: true, data: clone(demoState.customers) };
    if (action === 'get_customer_history') {
      const customer = demoState.customers.find(c => c.Customer_ID === params.id);
      return { success: true, data: { customer: clone(customer), leads: clone(demoState.leads.filter(x => x.Customer_ID === params.id)), bookings: clone(demoState.bookings.filter(x => x.Customer_ID === params.id)), quotes: clone(demoState.quotes.filter(x => x.Customer_ID === params.id)), invoices: clone(demoState.invoices.filter(x => x.Customer_ID === params.id)) } };
    }
    if (action === 'save_customer') {
      const p = JSON.parse(decodeURIComponent(params.data)); let customer = demoState.customers.find(c => c.Customer_ID === p.id);
      if (!customer) { customer = { Customer_ID: 'CUST-DEMO-' + Date.now(), Created_At: demoNow.toISOString(), Active: true }; demoState.customers.push(customer); }
      Object.assign(customer, { Name: p.name, Company: p.company, Email: p.email, Phone: p.phone, Address: p.address, Source: p.source || 'Manual', Notes: p.notes }); return { success: true, data: clone(customer) };
    }
    if (action === 'save_phone_inquiry') {
      const p = JSON.parse(decodeURIComponent(params.data)); let customer = demoState.customers.find(c => (p.customer.email && c.Email === p.customer.email) || (p.customer.phone && c.Phone === p.customer.phone));
      if (!customer) { customer = { Customer_ID: 'CUST-DEMO-' + Date.now(), Name: p.customer.name, Company: p.customer.company, Email: p.customer.email, Phone: p.customer.phone, Address: p.customer.address, Source: 'Phone call', Notes: p.customer.notes, Created_At: demoNow.toISOString(), Active: true }; demoState.customers.push(customer); }
      const lead = { Lead_ID: 'LEAD-DEMO-' + Date.now(), Customer_ID: customer.Customer_ID, Timestamp: demoNow.toISOString(), Name: customer.Name, Email: customer.Email, Phone: customer.Phone, 'Service Interested': p.service, Message: p.notes, Status: 'New', 'Source Page': 'Phone call' }; demoState.leads.unshift(lead); return { success: true, data: { customer: clone(customer), leadId: lead.Lead_ID } };
    }
    if (action === 'services') return { services: [{ name: 'Technology Help Visit', durationMinutes: 60, requiresAddress: true }, { name: 'Smart TV Setup', durationMinutes: 45, requiresAddress: true }] };
    if (action === 'availability') {
      const slots = []; for (let day = 1; day <= 10; day++) { const start = new Date(demoNow.getFullYear(), demoNow.getMonth(), demoNow.getDate() + day, 10, 0, 0); slots.push({ startIso: start.toISOString(), endIso: new Date(start.getTime() + 3600000).toISOString(), label: start.toLocaleString([], { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) }); }
      return { slots };
    }
    if (action === 'create_owner_booking') {
      const p = JSON.parse(decodeURIComponent(params.data)); const customer = demoState.customers.find(c => c.Customer_ID === p.customerId); if (!customer) return { success:false, error:'Choose a customer.' };
      const booking = { Booking_ID: 'BKG-DEMO-' + Date.now(), Customer_ID: customer.Customer_ID, Timestamp: demoNow.toISOString(), Name: customer.Name, Phone: customer.Phone, Email: customer.Email, Service: p.service, 'Appointment Time': p.slotStart, Address: p.address || customer.Address, Notes: p.notes, Status: 'Confirmed', 'Source Page': 'CRM dashboard' }; demoState.bookings.push(booking); return { success:true, data:clone(booking) };
    }
    if (action === 'list_bookings') return { success: true, data: clone(demoState.bookings) };
    if (action === 'list_requests') return { success: true, data: clone(demoState.requests) };
    if (action === 'list_quotes') return { success: true, data: clone(demoState.quotes) };
    if (action === 'list_invoices') return { success: true, data: clone(demoState.invoices) };
    if (action === 'list_catalog') return { success: true, data: clone(demoState.catalog.filter(i => i.Active)) };
    if (action === 'save_catalog_item') {
      const p = JSON.parse(decodeURIComponent(params.data)); let item = demoState.catalog.find(i => i.Item_ID === p.id);
      if (!item) { item = { Item_ID: 'ITEM-DEMO-' + Date.now() }; demoState.catalog.push(item); }
      Object.assign(item, { Name: p.name, Description: p.description, Type: p.type, Unit: p.unit, Duration_Minutes: p.durationMinutes, Rate: p.rate, Taxable: p.taxable, Active: true }); return { success: true, data: clone(item) };
    }
    if (action === 'archive_catalog_item') { const item = demoState.catalog.find(i => i.Item_ID === params.id); if (item) item.Active = false; return { success: true, data: { archived: true } }; }
    if (action === 'get_quote') return { success: true, data: clone(demoState.quotes.find(q => q.Quote_ID === params.id)) };
    if (action === 'get_invoice') return { success: true, data: clone(demoState.invoices.find(i => i.Invoice_ID === params.id)) };
    if (action === 'create_quote_from_source') {
      const source = params.sourceType === 'Booking' ? demoState.bookings.find(x => x.Booking_ID === params.sourceId) : demoState.leads.find(x => x.Lead_ID === params.sourceId);
      const quote = { Quote_ID: 'Q-DEMO-' + Date.now(), Customer_ID: source.Customer_ID || '', Quote_Number: 'Q-2026-' + String(demoState.quotes.length + 2).padStart(4, '0'), Customer_Name: source.Name, Customer_Email: source.Email, Customer_Phone: source.Phone, Source_Type: params.sourceType, Source_Reference: params.sourceId, Status: 'Draft', Created_Date: demoNow.toISOString(), Expiration_Date: new Date(demoNow.getTime() + 2592000000).toISOString(), Discount: 0, Notes: params.sourceType === 'Booking' ? ((source.Service || '') + '\n' + (source.Notes || '')) : (source.Message || ''), Terms: '', Created_At: demoNow.toISOString(), items: [] };
      demoState.quotes.unshift(quote); return { success: true, data: clone(quote) };
    }
    if (action === 'create_quote_from_request') {
      const source = demoState.requests.find(x => x.Request_ID === params.requestId);
      source.Status = 'Converted';
      const quote = { Quote_ID: 'Q-DEMO-' + Date.now(), Quote_Number: 'Q-2026-' + String(demoState.quotes.length + 2).padStart(4, '0'), Customer_Name: source.Name, Customer_Email: source.Email, Customer_Phone: source.Phone, Source_Type: 'Request', Source_Reference: source.Request_ID, Status: 'Draft', Created_Date: demoNow.toISOString(), Expiration_Date: new Date(demoNow.getTime() + 2592000000).toISOString(), Discount: 0, Notes: source.Details || '', Terms: '', Created_At: demoNow.toISOString(), items: [] };
      demoState.quotes.unshift(quote); return { success: true, data: clone(quote) };
    }
    if (action === 'save_quote') {
      const p = JSON.parse(decodeURIComponent(params.data));
      let quote = demoState.quotes.find(q => q.Quote_ID === p.id);
      if (!quote) { quote = { Quote_ID: 'Q-DEMO-' + Date.now(), Quote_Number: 'Q-2026-' + String(demoState.quotes.length + 2).padStart(4, '0'), Created_At: demoNow.toISOString() }; demoState.quotes.unshift(quote); }
      const subtotal = p.items.reduce((sum, item) => sum + item.quantity * item.rate, 0); const tax = p.items.filter(i => i.taxable).reduce((sum, item) => sum + item.quantity * item.rate, 0) * .085;
      Object.assign(quote, { Customer_ID: p.customerId || '', Customer_Name: p.customerName, Customer_Email: p.customerEmail, Customer_Phone: p.customerPhone, Status: p.status, Notes: p.notes, Terms: p.terms, Discount: p.discount, Created_Date: p.createdDate || demoNow.toISOString(), Expiration_Date: p.expirationDate, Subtotal: subtotal, Tax: tax, Total: subtotal - p.discount + tax, items: p.items.map(i => ({ Description: i.description, Quantity: i.quantity, Rate: i.rate, Amount: i.quantity * i.rate, Taxable: i.taxable })) });
      return { success: true, data: clone(quote) };
    }
    if (action === 'convert_to_invoice') {
      const q = demoState.quotes.find(x => x.Quote_ID === params.quoteId); const invoice = Object.assign({}, q, { Invoice_ID: 'INV-DEMO-' + Date.now(), Invoice_Number: 'INV-2026-' + String(demoState.invoices.length + 2).padStart(4, '0'), Source_Quote_ID: q.Quote_ID, Status: 'Draft', Due_Date: new Date(demoNow.getTime() + 1209600000).toISOString(), Amount_Paid: 0, Balance_Due: q.Total }); delete invoice.Quote_ID; delete invoice.Quote_Number; demoState.invoices.unshift(invoice); return { success: true, data: clone(invoice) };
    }
    if (action === 'save_invoice') {
      const p = JSON.parse(decodeURIComponent(params.data));
      let invoice = demoState.invoices.find(i => i.Invoice_ID === p.id);
      if (!invoice) { invoice = { Invoice_ID: 'INV-DEMO-' + Date.now(), Invoice_Number: 'INV-2026-' + String(demoState.invoices.length + 2).padStart(4, '0'), Created_At: demoNow.toISOString() }; demoState.invoices.unshift(invoice); }

      const callbackName = 'sqCallback' + (jsonpCounter++);
      window[callbackName] = function (result) {

  // SMART NOTES ASSISTANT — local extraction + browser AI matching

  let assistantEmbedder;

  function nextWeekdayDate(dayName) {
    const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const target = days.indexOf(dayName.toLowerCase());
    if (target < 0) return '';
    const date = new Date();
    let add = (target - date.getDay() + 7) % 7;
    if (add === 0) add = 7;
    date.setDate(date.getDate() + add);
    return date.toISOString().slice(0, 10);
  }

  function extractSmartNotes(notes, catalog) {
    const email = (notes.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i) || [''])[0];
    const phoneMatch = notes.match(/(?:\+?1[\s.-]?)?(?:\(?\d{3}\)?[\s.-]?)\d{3}[\s.-]?\d{4}/);
    const budgetMatch = notes.match(/(?:budget(?:\s+is)?|around|about|up to|estimate(?:d)?)?\s*\$\s*([\d,]+(?:\.\d{1,2})?)/i);
    const named = notes.match(/(?:my name is|this is|customer is|caller is)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,2})/);
    const opening = notes.match(/^\s*([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)\s+(?:needs|called|wants|would like|is looking)/);
    const weekday = notes.match(/(?:next\s+)?(monday|tuesday|wednesday|thursday|friday|saturday|sunday)/i);
    const isoDate = notes.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);
    const lower = notes.toLowerCase();
    let bestItem = null; let bestScore = 0;
    catalog.forEach(item => {
      const words = ((item.Name || '') + ' ' + (item.Description || '')).toLowerCase().split(/[^a-z0-9]+/).filter(word => word.length > 2);
      const score = words.reduce((sum, word) => sum + (lower.includes(word) ? 1 : 0), 0);
      if (score > bestScore) { bestScore = score; bestItem = item; }
    });
    return {
      name: (named && named[1]) || (opening && opening[1]) || '',
      phone: phoneMatch ? phoneMatch[0] : '',
      email,
      service: bestItem ? bestItem.Name : '',
      preferredDate: isoDate ? isoDate[0] : (weekday ? nextWeekdayDate(weekday[1]) : ''),
      budget: budgetMatch ? budgetMatch[1].replace(/,/g, '') : '',
      recommendation: weekday ? 'Create Booking' : (budgetMatch && bestItem ? 'Draft Quote' : 'Create Lead'),
      matchedItem: bestItem,
      notes,
      matchMethod: bestItem ? 'keyword fallback' : 'no catalog match'
    };
  }

  async function improveServiceMatchWithAI(result, catalog, onProgress) {
    if (!catalog.length) return result;
    onProgress('Loading the browser AI model for service matching…');
    try {
      if (!assistantEmbedder) {
        const transformers = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
        transformers.env.allowLocalModels = false;
        assistantEmbedder = await transformers.pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', { dtype: 'q8' });
      }
      onProgress('Matching the notes to your products and services…');
      const labels = catalog.map(item => (item.Name || '') + '. ' + (item.Description || ''));
      const vectors = await assistantEmbedder([result.notes].concat(labels), { pooling: 'mean', normalize: true });
      const dim = vectors.dims[vectors.dims.length - 1];
      const data = vectors.data;
      let bestIndex = 0; let bestScore = -Infinity;
      for (let i = 0; i < labels.length; i++) {
        let score = 0;
        for (let j = 0; j < dim; j++) score += data[j] * data[(i + 1) * dim + j];
        if (score > bestScore) { bestScore = score; bestIndex = i; }
      }
      result.matchedItem = catalog[bestIndex];
      result.service = catalog[bestIndex].Name;
      result.matchMethod = 'Hugging Face browser AI';
    } catch (error) {
      result.matchMethod = result.matchedItem ? 'local fallback (AI model unavailable)' : 'no catalog match';
    }
    return result;
  }

  async function renderQuoteEditor(quoteId, selectedCustomer) {
    mainEl.innerHTML = '<p class="hint">Loading...</p>';
    const assistantDraft = selectedCustomer && selectedCustomer._assistant;
    let quote = { Customer_ID: selectedCustomer ? selectedCustomer.Customer_ID : '', Customer_Name: selectedCustomer ? selectedCustomer.Name : '', Customer_Email: selectedCustomer ? selectedCustomer.Email : '', Customer_Phone: selectedCustomer ? selectedCustomer.Phone : '', Source_Type: assistantDraft ? 'Lead' : '', Source_Reference: assistantDraft ? 'AI Smart Notes' : '', Status: 'Draft', Notes: assistantDraft ? assistantDraft.notes : '', Terms: '', Discount: 0, items: assistantDraft && assistantDraft.item ? [{ Description: assistantDraft.item.Description || assistantDraft.item.Name, Quantity: 1, Rate: Number(assistantDraft.item.Rate) || 0, Taxable: assistantDraft.item.Taxable === true || String(assistantDraft.item.Taxable).toLowerCase() === 'true' }] : [{ Description: '', Quantity: 1, Rate: 0, Taxable: true }] };

    if (quoteId) {
      const result = await callApi('get_quote', { id: quoteId });
      if (!result.success) { mainEl.innerHTML = ''; mainEl.appendChild(errorCard(result.error)); return; }
      quote = result.data;
    }

    mainEl.innerHTML = '';
    const card = el('div', { className: 'card' });

    const toolbar = el('div', { className: 'toolbar' });
    toolbar.appendChild(el('h2', { style: 'margin:0;font-size:16px;' }, [quoteId ? ('Quote ' + quote.Quote_Number) : 'New Quote']));
    const backBtn = el('button', { className: 'btn btn-small' });
    backBtn.textContent = '\u2190 Back to Quotes';
    backBtn.addEventListener('click', renderQuotesList);
    toolbar.appendChild(backBtn);
    card.appendChild(toolbar);

    // Customer fields
    const customersResult = await callApi('list_customers');
    const customers = customersResult.success ? customersResult.data : [];
    let selectedCustomerId = quote.Customer_ID || '';
    const custRow = el('div', { className: 'field-row' });
    const nameField = textField('Customer Name', quote.Customer_Name);
    const emailField = textField('Customer Email', quote.Customer_Email);
    custRow.appendChild(nameField.wrapper);
    custRow.appendChild(emailField.wrapper);
    card.appendChild(custRow);

    const customerPicker = el('select');
    customerPicker.appendChild(el('option', { value: '' }, ['Enter customer manually']));
    customers.forEach(customer => { const option = el('option', { value: customer.Customer_ID }, [customer.Name + (customer.Phone ? ' — ' + customer.Phone : '')]); if (customer.Customer_ID === selectedCustomerId) option.selected = true; customerPicker.appendChild(option); });
    const customerPickerWrap = el('div', { className: 'field' }, [el('label', {}, ['Choose saved customer']), customerPicker]);
    customerPicker.addEventListener('change', () => { selectedCustomerId = customerPicker.value; const customer = customers.find(item => item.Customer_ID === selectedCustomerId); if (customer) { nameField.input.value = customer.Name || ''; emailField.input.value = customer.Email || ''; phoneField.input.value = customer.Phone || ''; } });
    card.insertBefore(customerPickerWrap, custRow);

    const custRow2 = el('div', { className: 'field-row' });
    const phoneField = textField('Customer Phone', quote.Customer_Phone);
    const statusField = selectField('Status', quote.Status || 'Draft', ['Draft', 'Sent', 'Accepted', 'Declined', 'Expired']);
    custRow2.appendChild(phoneField.wrapper);
    custRow2.appendChild(statusField.wrapper);
    card.appendChild(custRow2);

    const sourceRow = el('div', { className: 'field-row' });
    const sourceTypeField = selectField('Source', quote.Source_Type || '', ['', 'Lead', 'Booking']);
    const sourceRefField = textField('Source Reference', quote.Source_Reference || '', 'e.g. lead\'s email or booking date');
    sourceRow.appendChild(sourceTypeField.wrapper);
    sourceRow.appendChild(sourceRefField.wrapper);
    card.appendChild(sourceRow);

    // Line items
    card.appendChild(el('label', {}, ['Line Items']));
    const catalogResult = await callApi('list_catalog');
    const catalogItems = catalogResult.success ? catalogResult.data : [];
    const catalogRow = el('div', { className: 'field-row', style: 'align-items:end;margin-bottom:12px' });
    const catalogSelect = el('select');
    catalogSelect.appendChild(el('option', { value: '' }, ['Choose a saved product or service...']));
    catalogItems.forEach(item => catalogSelect.appendChild(el('option', { value: item.Item_ID }, [item.Name + ' — ' + formatMoney(item.Rate)])));
    const catalogWrap = el('div', { className: 'field' }, [el('label', {}, ['Add from catalog']), catalogSelect]);
    const addCatalogBtn = el('button', { className: 'btn', type: 'button', style: 'margin-bottom:14px' }, ['Add to Quote']);
    catalogRow.appendChild(catalogWrap); catalogRow.appendChild(addCatalogBtn); card.appendChild(catalogRow);
    const itemsTable = el('table', { className: 'items-table' });
    itemsTable.innerHTML = '<tr><th class="col-desc">Description</th><th class="col-qty">Qty</th><th class="col-rate">Rate</th><th class="col-amount">Amount</th><th class="col-tax">Tax?</th><th></th></tr>';
    card.appendChild(itemsTable);

    let items = (quote.items || []).map(i => ({
      description: i.Description || '', quantity: Number(i.Quantity) || 0, rate: Number(i.Rate) || 0, taxable: !!i.Taxable
    }));
    if (items.length === 0) items = [{ description: '', quantity: 1, rate: 0, taxable: true }];
    addCatalogBtn.addEventListener('click', () => {
      const selected = catalogItems.find(item => item.Item_ID === catalogSelect.value);
      if (!selected) return;
      if (items.length === 1 && !items[0].description && !items[0].rate) items = [];
      items.push({ description: selected.Description || selected.Name, quantity: 1, rate: Number(selected.Rate) || 0, taxable: selected.Taxable === true || String(selected.Taxable).toLowerCase() === 'true' });
      renderItemsRows(); recalcAndRenderTotals(); catalogSelect.value = '';
    });

    const totalsBox = el('div', { className: 'totals-box' });
    const discountField = numberField('Discount', quote.Discount || 0);

    function recalcAndRenderTotals() {
      const subtotal = items.reduce((s, i) => s + (i.quantity * i.rate), 0);
      const taxableSubtotal = items.filter(i => i.taxable).reduce((s, i) => s + (i.quantity * i.rate), 0);
      const discount = parseFloat(discountField.input.value) || 0;
      const taxRate = 8.5; // Phase 1: fixed default; Settings-driven in Phase 2
      const tax = taxableSubtotal * (taxRate / 100);
      const total = subtotal - discount + tax;
      totalsBox.innerHTML = `
        <div class="row"><span>Subtotal</span><span>${formatMoney(subtotal)}</span></div>
        <div class="row"><span>Discount</span><span>-${formatMoney(discount)}</span></div>
        <div class="row"><span>Tax (${taxRate}%)</span><span>${formatMoney(tax)}</span></div>
        <div class="row total"><span>Total</span><span>${formatMoney(total)}</span></div>
      `;
    }

    function renderItemsRows() {
      // Clear all rows except header
      while (itemsTable.rows.length > 1) itemsTable.deleteRow(1);
      items.forEach((item, idx) => {
        const row = itemsTable.insertRow();
        const descCell = row.insertCell();
        const descInput = el('input', { type: 'text', value: item.description });
        descInput.addEventListener('input', () => { item.description = descInput.value; });
        descCell.appendChild(descInput);

        const qtyCell = row.insertCell();
        const qtyInput = el('input', { type: 'number', value: item.quantity, step: '0.5' });
        qtyInput.addEventListener('input', () => { item.quantity = parseFloat(qtyInput.value) || 0; recalcAndRenderTotals(); });
        qtyCell.appendChild(qtyInput);

        const rateCell = row.insertCell();
        const rateInput = el('input', { type: 'number', value: item.rate, step: '0.01' });
        rateInput.addEventListener('input', () => { item.rate = parseFloat(rateInput.value) || 0; recalcAndRenderTotals(); });
        rateCell.appendChild(rateInput);

        const amountCell = row.insertCell();
        amountCell.textContent = formatMoney(item.quantity * item.rate);

        const taxCell = row.insertCell();
        taxCell.style.textAlign = 'center';
        const taxCheckbox = el('input', { type: 'checkbox', checked: item.taxable });
        taxCheckbox.addEventListener('change', () => { item.taxable = taxCheckbox.checked; recalcAndRenderTotals(); });
        taxCell.appendChild(taxCheckbox);

        const removeCell = row.insertCell();
        const removeBtn = el('button', { className: 'btn btn-small btn-danger', type: 'button' });
        removeBtn.textContent = '\u2715';
        removeBtn.addEventListener('click', () => {
          items.splice(idx, 1);
          if (items.length === 0) items.push({ description: '', quantity: 1, rate: 0, taxable: true });
          renderItemsRows();
          recalcAndRenderTotals();
        });
        removeCell.appendChild(removeBtn);
      });
      // recompute amount cells after render (need item refs, re-render is simplest and cheap for typical item counts)
      Array.from(itemsTable.rows).slice(1).forEach((row, idx) => {
        row.cells[3].textContent = formatMoney(items[idx].quantity * items[idx].rate);
      });
    }
    renderItemsRows();

    const addItemBtn = el('button', { className: 'btn btn-small', type: 'button', style: 'margin-top:8px;' });
    addItemBtn.textContent = '+ Add Line Item';
    addItemBtn.addEventListener('click', () => {
      items.push({ description: '', quantity: 1, rate: 0, taxable: true });
      renderItemsRows();
      recalcAndRenderTotals();
    });
    card.appendChild(addItemBtn);

    discountField.input.addEventListener('input', recalcAndRenderTotals);
    card.appendChild(el('div', { style: 'max-width:200px;margin-top:14px;' }, [discountField.wrapper]));
    card.appendChild(totalsBox);
    recalcAndRenderTotals();

    const notesField = textareaField('Notes', quote.Notes || '');
    const termsField = textareaField('Terms', quote.Terms || '');
    card.appendChild(notesField.wrapper);
    card.appendChild(termsField.wrapper);

    const statusLine = el('p', { className: 'status-line' });

    const actions = el('div', { className: 'form-actions' });
    const saveBtn = el('button', { className: 'btn btn-primary' });
    saveBtn.textContent = 'Save Quote';
    saveBtn.addEventListener('click', async () => {
      statusLine.textContent = 'Saving...';
      statusLine.className = 'status-line';
      const payload = {
        customerId: selectedCustomerId,
        id: quoteId || undefined,
        quoteNumber: quote.Quote_Number,
        createdAt: quote.Created_At,
        createdDate: quote.Created_Date,
        expirationDate: quote.Expiration_Date,
        customerName: nameField.input.value,
        customerEmail: emailField.input.value,
        customerPhone: phoneField.input.value,
        sourceType: sourceTypeField.select.value,
        sourceReference: sourceRefField.input.value,
        status: statusField.select.value,
        discount: parseFloat(discountField.input.value) || 0,
        taxRate: 8.5,
        notes: notesField.textarea.value,
        terms: termsField.textarea.value,
        items: items.filter(i => i.description || i.quantity || i.rate)
      };
      const result = await saveQuoteData(payload);
      if (result.success) {
        statusLine.textContent = 'Saved!';
        statusLine.className = 'status-line success';
        setTimeout(() => renderQuoteEditor(result.data.Quote_ID), 400);
      } else {
        statusLine.textContent = 'Error: ' + result.error;
        statusLine.className = 'status-line error';
      }
    });
    actions.appendChild(saveBtn);

    if (quoteId && quote.Status === 'Accepted') {
      const convertBtn = el('button', { className: 'btn btn-success' });
      convertBtn.textContent = 'Create Invoice from this Quote';
      convertBtn.addEventListener('click', async () => {
        const confirmed = await confirmDialog('Create a new invoice from this quote? The quote itself will not be changed.');
        if (!confirmed) return;
        statusLine.textContent = 'Converting...';
        const result = await callApi('convert_to_invoice', { quoteId: quoteId });
        if (result.success) {
          renderInvoiceEditor(result.data.Invoice_ID);
        } else {
          statusLine.textContent = 'Error: ' + result.error;
          statusLine.className = 'status-line error';
        }
      });
      actions.appendChild(convertBtn);
    }

    if (quoteId) {
      const pdfBtn = el('button', { className: 'btn' });
      pdfBtn.textContent = 'Print / Download PDF';
      pdfBtn.addEventListener('click', () => {
        const url = 'print-view.html?type=quote&id=' + encodeURIComponent(quoteId) + '&apiUrl=' + encodeURIComponent(CONFIG.apiUrl) + '&adminKey=' + encodeURIComponent(CONFIG.adminKey);
        window.open(url, '_blank');
      });
      actions.appendChild(pdfBtn);
    }

    if (quoteId && quote.Status === 'Draft') {
      const deleteBtn = el('button', { className: 'btn btn-danger' });
      deleteBtn.textContent = 'Delete Draft';
      deleteBtn.addEventListener('click', async () => {
        const confirmed = await confirmDialog('Delete this draft quote? This cannot be undone.');
        if (!confirmed) return;
        const result = await callApi('delete_quote', { id: quoteId });
        if (result.success) renderQuotesList();
        else { statusLine.textContent = 'Error: ' + result.error; statusLine.className = 'status-line error'; }
      });
      actions.appendChild(deleteBtn);
    }

    card.appendChild(actions);
    card.appendChild(statusLine);
    mainEl.appendChild(card);
  }

  // ============================================================
  // INVOICES LIST
  // ============================================================
  async function renderInvoicesList() {
    mainEl.innerHTML = '<p class="hint">Loading invoices...</p>';
    const result = await callApi('list_invoices');
    if (!result.success) { mainEl.innerHTML = ''; mainEl.appendChild(errorCard(result.error)); return; }
    invoicesCache = result.data;

    mainEl.innerHTML = '';
    const card = el('div', { className: 'card' });

    if (invoicesCache.length === 0) {
      card.appendChild(el('div', { className: 'empty-state' }, ['No invoices yet.']));
    } else {
      const table = el('table');
      table.innerHTML = '<tr><th>Invoice #</th><th>Customer</th><th>Status</th><th>Total</th><th>Balance Due</th><th>Due Date</th></tr>';
      invoicesCache.forEach(inv => {
        const row = el('tr');
        row.innerHTML = `<td>${escapeHtml(inv.Invoice_Number)}</td><td>${escapeHtml(inv.Customer_Name)}</td>` +
          `<td><span class="${badgeClass(inv.Status)}">${escapeHtml(inv.Status)}</span></td>` +
          `<td>${formatMoney(inv.Total)}</td><td>${formatMoney(inv.Balance_Due)}</td><td>${formatDate(inv.Due_Date)}</td>`;
        row.addEventListener('click', () => renderInvoiceEditor(inv.Invoice_ID));
        table.appendChild(row);
      });
      card.appendChild(table);
    }
    mainEl.appendChild(card);
  }

  // ============================================================
  // INVOICE EDITOR
  // ============================================================
  async function renderInvoiceEditor(invoiceId, selectedCustomer) {
    mainEl.innerHTML = '<p class="hint">Loading...</p>';
    let invoice = { Customer_ID: selectedCustomer ? selectedCustomer.Customer_ID : '', Customer_Name: selectedCustomer ? selectedCustomer.Name : '', Customer_Email: selectedCustomer ? selectedCustomer.Email : '', Customer_Phone: selectedCustomer ? selectedCustomer.Phone : '', Status: 'Draft', Notes: '', Payment_Instructions: '', Discount: 0, Amount_Paid: 0, items: [{ Description: '', Quantity: 1, Rate: 0, Taxable: true }] };

    if (invoiceId) {
      const result = await callApi('get_invoice', { id: invoiceId });
      if (!result.success) { mainEl.innerHTML = ''; mainEl.appendChild(errorCard(result.error)); return; }
      invoice = result.data;
    }

    mainEl.innerHTML = '';
    const card = el('div', { className: 'card' });

    const toolbar = el('div', { className: 'toolbar' });
    toolbar.appendChild(el('h2', { style: 'margin:0;font-size:16px;' }, [invoiceId ? ('Invoice ' + invoice.Invoice_Number) : 'New Invoice']));
    const backBtn = el('button', { className: 'btn btn-small' });
    backBtn.textContent = '\u2190 Back to Invoices';
    backBtn.addEventListener('click', renderInvoicesList);
    toolbar.appendChild(backBtn);
    card.appendChild(toolbar);

    if (invoice.Source_Quote_ID) {
      card.appendChild(el('p', { className: 'hint' }, ['Created from quote — view it in the Quotes tab.']));
    }

    const custRow = el('div', { className: 'field-row' });
    const nameField = textField('Customer Name', invoice.Customer_Name);
    const emailField = textField('Customer Email', invoice.Customer_Email);
    custRow.appendChild(nameField.wrapper);
    custRow.appendChild(emailField.wrapper);
    card.appendChild(custRow);
    const invoiceCustomersResult = await callApi('list_customers');
    const invoiceCustomers = invoiceCustomersResult.success ? invoiceCustomersResult.data : [];
    let invoiceCustomerId = invoice.Customer_ID || '';
    const invoiceCustomerPicker = el('select'); invoiceCustomerPicker.appendChild(el('option', { value: '' }, ['Enter customer manually']));
    invoiceCustomers.forEach(customer => { const option = el('option', { value: customer.Customer_ID }, [customer.Name + (customer.Phone ? ' — ' + customer.Phone : '')]); if (customer.Customer_ID === invoiceCustomerId) option.selected = true; invoiceCustomerPicker.appendChild(option); });
    const invoicePickerWrap = el('div', { className: 'field' }, [el('label', {}, ['Choose saved customer']), invoiceCustomerPicker]);
    invoiceCustomerPicker.addEventListener('change', () => { invoiceCustomerId = invoiceCustomerPicker.value; const customer = invoiceCustomers.find(item => item.Customer_ID === invoiceCustomerId); if (customer) { nameField.input.value = customer.Name || ''; emailField.input.value = customer.Email || ''; phoneField.input.value = customer.Phone || ''; } });
    card.insertBefore(invoicePickerWrap, custRow);

    const custRow2 = el('div', { className: 'field-row' });
    const phoneField = textField('Customer Phone', invoice.Customer_Phone);
    const dueDateField = textField('Due Date', invoice.Due_Date ? new Date(invoice.Due_Date).toISOString().split('T')[0] : '', '', 'date');
    custRow2.appendChild(phoneField.wrapper);
    custRow2.appendChild(dueDateField.wrapper);
    card.appendChild(custRow2);

    card.appendChild(el('label', {}, ['Line Items']));
    const itemsTable = el('table', { className: 'items-table' });
    itemsTable.innerHTML = '<tr><th class="col-desc">Description</th><th class="col-qty">Qty</th><th class="col-rate">Rate</th><th class="col-amount">Amount</th><th class="col-tax">Tax?</th><th></th></tr>';
    card.appendChild(itemsTable);

    let items = (invoice.items || []).map(i => ({
      description: i.Description || '', quantity: Number(i.Quantity) || 0, rate: Number(i.Rate) || 0, taxable: !!i.Taxable
    }));
    if (items.length === 0) items = [{ description: '', quantity: 1, rate: 0, taxable: true }];

    const totalsBox = el('div', { className: 'totals-box' });
    const discountField = numberField('Discount', invoice.Discount || 0);
    const amountPaidField = numberField('Amount Paid', invoice.Amount_Paid || 0);

    function recalcAndRenderTotals() {
      const subtotal = items.reduce((s, i) => s + (i.quantity * i.rate), 0);
      const taxableSubtotal = items.filter(i => i.taxable).reduce((s, i) => s + (i.quantity * i.rate), 0);
      const discount = parseFloat(discountField.input.value) || 0;
      const taxRate = 8.5;
      const tax = taxableSubtotal * (taxRate / 100);
      const total = subtotal - discount + tax;
      const amountPaid = parseFloat(amountPaidField.input.value) || 0;
      const balance = total - amountPaid;
      totalsBox.innerHTML = `
        <div class="row"><span>Subtotal</span><span>${formatMoney(subtotal)}</span></div>
        <div class="row"><span>Discount</span><span>-${formatMoney(discount)}</span></div>
        <div class="row"><span>Tax (${taxRate}%)</span><span>${formatMoney(tax)}</span></div>
        <div class="row total"><span>Total</span><span>${formatMoney(total)}</span></div>
        <div class="row"><span>Amount Paid</span><span>${formatMoney(amountPaid)}</span></div>
        <div class="row total"><span>Balance Due</span><span>${formatMoney(balance)}</span></div>
      `;
    }

    function renderItemsRows() {
      while (itemsTable.rows.length > 1) itemsTable.deleteRow(1);
      items.forEach((item, idx) => {
        const row = itemsTable.insertRow();
        const descCell = row.insertCell();
        const descInput = el('input', { type: 'text', value: item.description });
        descInput.addEventListener('input', () => { item.description = descInput.value; });
        descCell.appendChild(descInput);

        const qtyCell = row.insertCell();
        const qtyInput = el('input', { type: 'number', value: item.quantity, step: '0.5' });
        qtyInput.addEventListener('input', () => { item.quantity = parseFloat(qtyInput.value) || 0; recalcAndRenderTotals(); });
        qtyCell.appendChild(qtyInput);

        const rateCell = row.insertCell();
        const rateInput = el('input', { type: 'number', value: item.rate, step: '0.01' });
        rateInput.addEventListener('input', () => { item.rate = parseFloat(rateInput.value) || 0; recalcAndRenderTotals(); });
        rateCell.appendChild(rateInput);

        const amountCell = row.insertCell();
        amountCell.textContent = formatMoney(item.quantity * item.rate);

        const taxCell = row.insertCell();
        taxCell.style.textAlign = 'center';
        const taxCheckbox = el('input', { type: 'checkbox', checked: item.taxable });
        taxCheckbox.addEventListener('change', () => { item.taxable = taxCheckbox.checked; recalcAndRenderTotals(); });
        taxCell.appendChild(taxCheckbox);

        const removeCell = row.insertCell();
        const removeBtn = el('button', { className: 'btn btn-small btn-danger', type: 'button' });
        removeBtn.textContent = '\u2715';
        removeBtn.addEventListener('click', () => {
          items.splice(idx, 1);
          if (items.length === 0) items.push({ description: '', quantity: 1, rate: 0, taxable: true });
          renderItemsRows();
          recalcAndRenderTotals();
        });
        removeCell.appendChild(removeBtn);
      });
      Array.from(itemsTable.rows).slice(1).forEach((row, idx) => {
        row.cells[3].textContent = formatMoney(items[idx].quantity * items[idx].rate);
      });
    }
    renderItemsRows();

    const addItemBtn = el('button', { className: 'btn btn-small', type: 'button', style: 'margin-top:8px;' });
    addItemBtn.textContent = '+ Add Line Item';
    addItemBtn.addEventListener('click', () => {
      items.push({ description: '', quantity: 1, rate: 0, taxable: true });
      renderItemsRows();
      recalcAndRenderTotals();
    });
    card.appendChild(addItemBtn);

    discountField.input.addEventListener('input', recalcAndRenderTotals);
    amountPaidField.input.addEventListener('input', recalcAndRenderTotals);
    const moneyRow = el('div', { className: 'field-row', style: 'max-width:420px;margin-top:14px;' });
    moneyRow.appendChild(discountField.wrapper);
    moneyRow.appendChild(amountPaidField.wrapper);
    card.appendChild(moneyRow);
    card.appendChild(totalsBox);
    recalcAndRenderTotals();

    const payMethodField = textField('Payment Method', invoice.Payment_Method || '', 'e.g. Check, Venmo, Cash');
    card.appendChild(payMethodField.wrapper);
    const notesField = textareaField('Notes', invoice.Notes || '');
    const payInstructionsField = textareaField('Payment Instructions', invoice.Payment_Instructions || '');
    card.appendChild(notesField.wrapper);
    card.appendChild(payInstructionsField.wrapper);

    const statusLine = el('p', { className: 'status-line' });

    const actions = el('div', { className: 'form-actions' });
    const saveBtn = el('button', { className: 'btn btn-primary' });
    saveBtn.textContent = 'Save Invoice';
    saveBtn.addEventListener('click', async () => {
      statusLine.textContent = 'Saving...';
      statusLine.className = 'status-line';
      const payload = {
        customerId: invoiceCustomerId,
        id: invoiceId || undefined,
        invoiceNumber: invoice.Invoice_Number,
        createdAt: invoice.Created_At,
        createdDate: invoice.Created_Date,
        sourceQuoteId: invoice.Source_Quote_ID,
        dueDate: dueDateField.input.value,
        customerName: nameField.input.value,
        customerEmail: emailField.input.value,
        customerPhone: phoneField.input.value,
        status: invoice.Status,
        discount: parseFloat(discountField.input.value) || 0,
        taxRate: 8.5,
        amountPaid: parseFloat(amountPaidField.input.value) || 0,
        paymentMethod: payMethodField.input.value,
        notes: notesField.textarea.value,
        paymentInstructions: payInstructionsField.textarea.value,
        items: items.filter(i => i.description || i.quantity || i.rate)
      };
      const result = await saveInvoiceData(payload);
      if (result.success) {
        statusLine.textContent = 'Saved!';
        statusLine.className = 'status-line success';
        setTimeout(() => renderInvoiceEditor(result.data.Invoice_ID), 400);
      } else {
        statusLine.textContent = 'Error: ' + result.error;
        statusLine.className = 'status-line error';
      }
    });
    actions.appendChild(saveBtn);

    if (invoiceId) {
      const pdfBtn = el('button', { className: 'btn' });
      pdfBtn.textContent = 'Print / Download PDF';
      pdfBtn.addEventListener('click', () => {
        const url = 'print-view.html?type=invoice&id=' + encodeURIComponent(invoiceId) + '&apiUrl=' + encodeURIComponent(CONFIG.apiUrl) + '&adminKey=' + encodeURIComponent(CONFIG.adminKey);
        window.open(url, '_blank');
      });
      actions.appendChild(pdfBtn);
    }

    card.appendChild(actions);
    card.appendChild(statusLine);
    mainEl.appendChild(card);
  }

  // ---- Field builder helpers ----
  function textField(labelText, value, placeholder, type) {
    const wrapper = el('div', { className: 'field' });
    wrapper.appendChild(el('label', {}, [labelText]));
    const input = el('input', { type: type || 'text', value: value || '', placeholder: placeholder || '' });
    wrapper.appendChild(input);
    return { wrapper, input };
  }
  function numberField(labelText, value) {
    const wrapper = el('div', { className: 'field' });
    wrapper.appendChild(el('label', {}, [labelText]));
    const input = el('input', { type: 'number', value: value || 0, step: '0.01' });
    wrapper.appendChild(input);
    return { wrapper, input };
  }
  function textareaField(labelText, value) {
    const wrapper = el('div', { className: 'field' });
    wrapper.appendChild(el('label', {}, [labelText]));
    const textarea = el('textarea', { value: value || '' });
    textarea.value = value || '';
    wrapper.appendChild(textarea);
    return { wrapper, textarea };
  }
  function selectField(labelText, value, options) {
    const wrapper = el('div', { className: 'field' });
    wrapper.appendChild(el('label', {}, [labelText]));
    const select = el('select');
    options.forEach(opt => {
      const o = el('option', { value: opt });
      o.textContent = opt || '-- None --';
      if (opt === value) o.selected = true;
      select.appendChild(o);
    });
    wrapper.appendChild(select);
    return { wrapper, select };
  }

  // ============================================================
  // NAV
  // ============================================================
  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      if (currentView === 'leads') renderSourceList('Lead');
      else if (currentView === 'customers') renderCustomersList();
      else if (currentView === 'bookings') renderBookingsWorkspace();
      else if (currentView === 'catalog') renderCatalog();
      else if (currentView === 'requests') renderRequestsList();
      else if (currentView === 'quotes') renderQuotesList();
      else renderInvoicesList();
    });
  });
  document.getElementById('new-quote-btn').addEventListener('click', () => renderQuoteEditor(null));
  document.getElementById('new-invoice-btn').addEventListener('click', () => renderInvoiceEditor(null));
  document.getElementById('new-customer-btn').addEventListener('click', () => renderCustomerEditor());
  document.getElementById('phone-inquiry-btn').addEventListener('click', renderPhoneInquiry);
  document.getElementById('ai-assistant-btn').addEventListener('click', renderAiAssistant);

  // ============================================================
  // INIT
  // ============================================================
  renderSourceList('Lead');

  // Register the service worker so the app can be "Added to Home
  // Screen" and its shell can open even offline. This never affects
  // the live JSONP calls to Apps Script — see sw.js for why.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // Non-fatal: the app works fine without a service worker,
        // e.g. when opened directly from a local file.
      });
    });
  }
</script>

</body>
